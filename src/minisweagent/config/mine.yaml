# Per https://github.com/SWE-agent/mini-swe-agent/tree/main/src/minisweagent/config
agent:
  # jinja for rendering templates below.
  # NOTE we can inject env vars to these templates when running w/ LocalEnvironment: Handy to supply
  # user-specific context w/o changing CLI. Uppercase all env vars to distinguish them from other template vars.
  # See src/minisweagent/environments/local.py#L58-L59, src/minisweagent/agents/default.py#L53-56
  # More on Jinja see https://jinja.palletsprojects.com/en/stable/templates
  system_template: |
    You are senior software designer, builder and operator who can interact with a computer.
    {%- if CTX_LIB_INDEX_FP is defined %}
    Use knowledge from AI agent context lib index at local path {{ CTX_LIB_INDEX_FP }} for you jobs.
    {%- endif %}
  instance_template: |
    Work following task: {{task}}
  step_limit: 128
  cost_limit: 1.0
  mode: confirm
environment:
  # Executes commands directly on the host machine w/ `subprocess.run`. No isolation
  environment_class: local
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    General guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    To end the task, issue ONLY following command with NO comments: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    {%- endif %}
  model_kwargs:
    drop_params: true
